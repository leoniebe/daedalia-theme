# Checks on every push and pull request: the coding standard and static analysis, and on the oldest
# and newest supported PHP a fresh WordPress that must serve pages with the theme without a PHP error.
# Daedalia is not bundled here (it has its own repository), so this also covers the theme without it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: PHPCS and PHPStan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs -q
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G
      - name: Visitor address of the login limiter (behind Cloudflare)
        run: php tests/ip.php
      - name: Updates only from a newer release of this repository
        run: php tests/updates.php
      - name: Every string translated, the built files up to date
        run: composer i18n:check

  render:
    name: Pages render (PHP ${{ matrix.php }}, WordPress 7.1)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: thema_ci
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP: wp --path=/tmp/wordpress
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl, gd, zip
          coverage: none
          tools: wp-cli
      - name: WordPress with the theme
        run: |
          $WP core download --version=7.1 --locale=nl_NL
          $WP config create --dbname=thema_ci --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --extra-php <<'PHP'
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', '/tmp/debug.log' );
          define( 'WP_DEBUG_DISPLAY', false );
          PHP
          $WP core install --url=http://127.0.0.1:8080 --title=Thema --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          $WP option update permalink_structure '/%postname%/'
          ln -s "$GITHUB_WORKSPACE" /tmp/wordpress/wp-content/themes/daedalia-thema
          $WP theme activate daedalia-thema
          post=$($WP post create --post_type=post --post_status=publish --post_title='Bericht' --post_content='Tekst.' --porcelain)
          $WP comment create --comment_post_ID="$post" --comment_content='Een reactie.' --comment_author='Lezer' --comment_approved=1
      - name: Home, a post with a comment, a page, search and a 404 render without PHP errors
        run: |
          php -S 127.0.0.1:8080 -t /tmp/wordpress >/tmp/server.log 2>&1 &
          sleep 2
          for path in / /bericht/ /voorbeeld-pagina/ '/?s=tekst' /bestaat-niet/; do
            status=$(curl -s -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:8080$path")
            echo "$status $path"
            case "$path" in /bestaat-niet/) [ "$status" = 404 ] ;; *) [ "$status" = 200 ] ;; esac
            grep -q 'daedalia-thema' /tmp/page.html
          done
          if [ -s /tmp/debug.log ]; then cat /tmp/debug.log; exit 1; fi
      - name: A Daedalia plugin older than the theme needs gets a notice
        run: |
          mkdir -p /tmp/wordpress/wp-content/mu-plugins
          cat > /tmp/wordpress/wp-content/mu-plugins/oude-daedalia.php <<'PHP'
          <?php
          namespace Daedalia;
          define( 'DAEDALIA_VERSION', '0.1.0' );
          final class Plugin { public static function instance(): self { return new self(); } }
          PHP
          $WP eval 'do_action( "admin_notices" );' --user=admin | tee /tmp/notice.html
          grep -q 'Daedalia 0.1.0 is te oud' /tmp/notice.html
          rm /tmp/wordpress/wp-content/mu-plugins/oude-daedalia.php
